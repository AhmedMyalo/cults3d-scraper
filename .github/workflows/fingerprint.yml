name: fingerprint

# DIAGNOSTIC ONLY - this workflow does NOT scrape anything.
#
# It opens Chrome under xvfb on the runner, navigates to about:blank, and reads
# the browser's own automation signals. There is NO request to cults3d.com and
# no request to any third-party site; the only network traffic is GitHub's own
# package installs.
#
# Why it exists: the earlier CI attempt failed with three variables changed at
# once (datacentre IP, xvfb display, Linux). This captures the same fingerprint
# the working Windows machine produced, so the two can be diffed and the actual
# cause identified instead of guessed.

on:
  push:
    branches: [main]
    paths:
      - "fingerprint.py"
      - ".github/workflows/fingerprint.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -q patchright
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          # A bare runner resolves 4 of 15 common fonts; a real desktop does
          # 13. Font coverage is cheap for a detector to measure, so install
          # the families a Windows/desktop browser would actually have.
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" \
            | sudo debconf-set-selections
          sudo apt-get install -y -qq \
            fonts-liberation fonts-liberation2 fonts-dejavu fonts-dejavu-extra \
            fonts-noto-core fonts-noto-color-emoji fonts-freefont-ttf \
            ttf-mscorefonts-installer || true
          sudo fc-cache -f >/dev/null 2>&1 || true
          echo "chrome    : $(google-chrome --version 2>&1 || echo MISSING)"
          echo "cpus      : $(nproc)"
          echo "fonts     : $(fc-list | wc -l) installed"

      - name: Fingerprint under xvfb (with GPU fallback + fonts)
        run: |
          xvfb-run -a --server-args="-screen 0 1536x960x24" \
            python fingerprint.py diagnostics/fp_ci_xvfb.json

      - name: Fingerprint WITHOUT the gpu flags, for comparison
        run: |
          rm -rf fp_profile
          CHROME_GL_ARGS="" xvfb-run -a --server-args="-screen 0 1536x960x24" \
            python fingerprint.py diagnostics/fp_ci_nogl.json

      - name: Publish result
        if: always()
        run: |
          git config user.name  "cults3d-scraper"
          git config user.email "scraper@users.noreply.github.com"
          git add -f diagnostics/fp_ci_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing produced"
          else
            git commit -q -m "ci fingerprint under xvfb [skip ci]"
            git pull --rebase -q origin main || true
            git push -q origin HEAD:main && echo "published"
          fi
