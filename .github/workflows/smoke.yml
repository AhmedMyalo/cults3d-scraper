name: smoke

# Answers the one question that cannot be tested from a Windows dev box:
# does patchright + real Chrome under xvfb clear Cloudflare from a GitHub
# runner, whose datacentre IP Cloudflare treats far more harshly than a home
# connection?
#
# The first run failed at exactly that step. Job logs need an auth token to
# read, so this commits its findings into diagnostics/ instead, where they can
# be read from the public raw URL.

# Answered its question on 2026-09-22: Cloudflare will not clear a GitHub
# runner's datacentre IP (see diagnostics/ci_report.json). Left in place so the
# result can be re-checked if Cults3D changes its Cloudflare settings, but no
# longer runs on every push - each run costs 25 minutes and a commit.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -q -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          echo "chrome: $(google-chrome --version 2>&1 || echo MISSING)"
          echo "runner ip: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"

      - name: Diagnose the Cloudflare path
        continue-on-error: true
        run: |
          xvfb-run -a --server-args="-screen 0 1366x900x24" \
            python ci_diagnose.py

      - name: Publish diagnostics
        if: always()
        run: |
          git config user.name  "cults3d-scraper"
          git config user.email "scraper@users.noreply.github.com"
          git add -f diagnostics/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no diagnostics produced"
          else
            git commit -q -m "ci diagnostics [skip ci]"
            git pull --rebase -q origin main || true
            git push -q origin HEAD:main && echo "diagnostics pushed"
          fi
